# Tunnel-only ingress. Docker publishes this listener on host loopback only.
# Trust boundary: local cloudflared and trusted members of the private Docker network.
# Cloudflare overwrites X-Forwarded-Proto with the visitor protocol.
map $http_x_forwarded_proto $tunnel_https {
    default 0;
    https 1;
}
map "$tunnel_https:$uri" $tunnel_request_allowed {
    default 0;
    ~^1: 1;
    "0:/_nginx_health" 1;
}
map $http_cf_connecting_ip $tunnel_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Fail closed if the edge did not attest HTTPS; do not trust public direct HTTP.
    if ($tunnel_request_allowed = 0) { return 400; }

    location = /_nginx_health { return 200 'ok'; }
    location = /api/v1/games/internal { return 404; }
    location ^~ /api/v1/games/internal/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
        # Prevent caching of index.html so frontend updates are immediately loaded
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Static assets with cache control
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $tunnel_client_ip;
        proxy_set_header X-Forwarded-For $tunnel_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    location /admin {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $tunnel_client_ip;
        proxy_set_header X-Forwarded-For $tunnel_client_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Metrics remain accessible via the private backend network.
    location ^~ /metrics { return 404; }

    location /ws {
        proxy_pass http://game-engine:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $tunnel_client_ip;
        proxy_set_header X-Forwarded-For $tunnel_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
