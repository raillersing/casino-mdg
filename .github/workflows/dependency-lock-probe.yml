name: Temporary i18next lock resolution
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched package with npm
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact i18next@26.3.4
          node -e 'const p=require("./package-lock.json"); console.log("I18NEXT_LOCK="+JSON.stringify(p.packages["node_modules/i18next"])); console.log("I18NEXT_ROOT="+JSON.stringify(p.packages[""].dependencies.i18next))'
          git diff -- package.json package-lock.json
