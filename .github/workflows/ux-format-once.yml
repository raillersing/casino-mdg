name: One-time format of UX v2 files

on:
  push:
    branches:
      - feat/mobile-first-game-lobby-2026-11-13
    paths:
      - .github/workflows/ux-format-once.yml

permissions:
  contents: write

jobs:
  format-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-first-game-lobby-2026-11-13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Format only the newly introduced UI files
        working-directory: frontend
        run: >
          npx prettier --write
          src/components/game/GameLobbyEntryActions.tsx
          src/components/game/QuickCreateTableSheet.tsx
          src/components/game/TableAvailabilityCard.tsx
          src/styles/game-lobby-v2.css
      - name: Commit formatted files on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/game/GameLobbyEntryActions.tsx
          git add frontend/src/components/game/QuickCreateTableSheet.tsx
          git add frontend/src/components/game/TableAvailabilityCard.tsx
          git add frontend/src/styles/game-lobby-v2.css
          if ! git diff --cached --quiet; then
            git commit -m "style(ux): format new mobile lobby components with prettier"
            git push origin HEAD:feat/mobile-first-game-lobby-2026-11-13
          fi
