# Temporary one-shot diagnostic. Removed after locking Go module checksums.
name: SECURITY Go dependency lock bootstrap
on:
  push:
    branches: [fix/security-go-deps-2026-11-16]
permissions:
  contents: read
jobs:
  regenerate-lock:
    name: Regenerate Go module checksum evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: game-engine/go.sum
      - name: Generate deterministic module manifest and check compilation
        working-directory: game-engine
        run: |
          go mod tidy
          echo '===BEGIN GOMOD==='
          cat go.mod
          echo '===END GOMOD==='
          echo '===BEGIN GOSUM==='
          cat go.sum
          echo '===END GOSUM==='
          go test ./...
