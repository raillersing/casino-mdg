name: Format matchmaking reliability patch once
# Final alignment includes cancellation-race recovery and its browser regression test.

on:
  push:
    branches: [feat/matchmaking-resume-reliability-2026-11-13]
    paths:
      - .github/workflows/format-matchmaking-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/matchmaking-resume-reliability-2026-11-13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project formatters
        run: |
          cd frontend && npm ci
          python -m pip install black isort
      - name: Format changed frontend files
        working-directory: frontend
        run: npx prettier --write src/pages/LobbyPage.tsx src/services/games.ts src/styles/game-lobby-v2.css tests/e2e/mobile-game-lobby-v2.spec.ts
      - name: Format changed backend files
        working-directory: backend
        run: |
          black apps/games/matchmaking.py apps/games/views.py apps/games/test_matchmaking.py
          isort apps/games/matchmaking.py apps/games/views.py apps/games/test_matchmaking.py
      - name: Commit formatting on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/LobbyPage.tsx frontend/src/services/games.ts frontend/src/styles/game-lobby-v2.css frontend/tests/e2e/mobile-game-lobby-v2.spec.ts backend/apps/games/matchmaking.py backend/apps/games/views.py backend/apps/games/test_matchmaking.py
          if ! git diff --cached --quiet; then
            git commit -m "style: conform matchmaking changes to Black, isort and Prettier"
            git fetch origin feat/matchmaking-resume-reliability-2026-11-13
            git rebase origin/feat/matchmaking-resume-reliability-2026-11-13
            git push origin HEAD:feat/matchmaking-resume-reliability-2026-11-13
          fi
