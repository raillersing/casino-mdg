name: One-off frontend and backend format alignment

on:
  push:
    branches: [feat/mobile-first-game-lobby-2026-11-13]
    paths:
      - .github/workflows/refonte-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-first-game-lobby-2026-11-13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatting dependencies
        run: |
          cd frontend && npm ci
          python -m pip install black isort
      - name: Align frontend formatting
        working-directory: frontend
        run: npx prettier --write "src/**/*.{ts,tsx,css}"
      - name: Align backend formatting
        run: |
          black backend
          isort backend
      - name: Commit formatting on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src backend
          if ! git diff --cached --quiet; then
            git commit -m "style: align frontend and backend formatting to CI checks"
            git fetch origin feat/mobile-first-game-lobby-2026-11-13
            git rebase origin/feat/mobile-first-game-lobby-2026-11-13
            git push origin HEAD:feat/mobile-first-game-lobby-2026-11-13
          fi
